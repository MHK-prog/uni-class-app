<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09080d">
  <title>برنامهٔ کلاس‌ها</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="برنامهٔ کلاس‌ها"><strong>کلاس‌های من</strong></a>
      <div class="top-actions">
        <button class="menu-button" id="menu-button" type="button" aria-label="باز کردن منو" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-drawer"><span aria-hidden="true">☰</span><i class="incomplete-indicator" aria-hidden="true" hidden></i></button>
      </div>
    </header>

    <section class="app-page" id="page-dashboard" data-page-panel="dashboard" aria-label="برنامه">
      <section class="day-context" aria-label="زمان و هفته">
        <div><strong id="selected-date">—</strong><span id="iran-clock">—</span></div>
        <span class="week-badge"><strong id="cycle-week-label">—</strong></span>
      </section>
      <nav class="day-switch" aria-label="انتخاب روز">
        <button type="button" class="day-option active" data-day="today" aria-pressed="true"><span>امروز</span><small id="today-name">—</small></button>
        <button type="button" class="day-option" data-day="tomorrow" aria-pressed="false"><span>فردا</span><small id="tomorrow-name">—</small></button>
      </nav>
      <section class="schedule-section" aria-label="برنامهٔ کلاس‌ها">
        <div id="schedule-list" class="schedule-list" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden><p id="empty-title">امروز کلاسی ندارید</p></div>
      </section>
      <footer class="app-footer">نسخهٔ <span id="app-version">۱.۹.۰</span></footer>
    </section>

    <section class="app-page" id="page-courses" data-page-panel="courses" hidden>
      <div class="page-heading"><h1>درس‌ها</h1><button class="primary-button" id="add-course-button" type="button">＋ افزودن درس</button></div>
      <div id="manage-course-list" class="schedule-list"></div>
      <div id="manage-empty" class="empty-state" hidden><p>هنوز درسی اضافه نکرده‌اید.</p></div>
    </section>

    <section class="app-page notes-page" id="page-notes" data-page-panel="notes" hidden>
      <div class="page-heading notes-heading">
        <button class="secondary-button" id="back-to-courses" type="button">بازگشت</button>
        <div><h1>یادداشت‌ها</h1><small id="notes-course-name"></small></div>
        <button class="primary-button" id="add-note-button" type="button">＋ یادداشت</button>
      </div>
      <div id="notes-list" class="notes-list"></div>
      <div id="notes-empty" class="empty-state" hidden><p>یادداشتی ثبت نشده.</p></div>
    </section>

    <section class="app-page settings-page" id="page-settings" data-page-panel="settings" hidden>
      <h1>تنظیمات</h1>
      <form id="term-settings-form" class="settings-form term-settings-form">
        <label>تاریخ شروع ترم<input id="term-start-date" type="date" required></label>
        <label>هفتهٔ آغاز ترم<select id="term-start-parity"><option value="odd">فرد</option><option value="even">زوج</option></select></label>
        <button class="secondary-button" type="submit">ذخیره</button>
      </form>
      <div class="settings-actions">
        <button class="menu-action" id="import-button" type="button">ورود برنامه</button>
        <button class="menu-action" id="export-button" type="button">ذخیرهٔ پشتیبان</button>
      </div>
    </section>
  </main>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <dialog id="menu-drawer" class="menu-drawer" aria-label="منو">
    <div class="dialog-heading"><h2>منو</h2><button type="button" class="icon-button close-menu" aria-label="بستن منو">×</button></div>
    <button class="menu-action page-link active" type="button" data-page="dashboard"><img class="menu-item-icon" src="assets/icons/home.webp" width="24" height="24" alt="" aria-hidden="true">برنامه</button>
    <button class="menu-action page-link" type="button" data-page="courses"><img class="menu-item-icon" src="assets/icons/edit.webp" width="24" height="24" alt="" aria-hidden="true">مدیریت درس‌ها</button>
    <button class="menu-action page-link" type="button" data-page="settings"><img class="menu-item-icon" src="assets/icons/setting.webp" width="24" height="24" alt="" aria-hidden="true">تنظیمات</button>
    <footer class="app-footer">نسخهٔ <span>۱.۹.۰</span></footer>
  </dialog>
  <dialog id="course-dialog" class="course-dialog">
    <form id="course-form" novalidate>
      <div class="dialog-heading"><h2 id="dialog-title">افزودن درس</h2><button type="button" class="icon-button close-dialog" aria-label="بستن">×</button></div>
      <input id="course-id" name="id" type="hidden">
      <label class="field-label">نام درس<input name="title" id="course-title" maxlength="80" required placeholder="نام درس"></label>
      <div class="field-label schedule-picker">
        <span>روزهای برگزاری</span>
        <div class="week-day-row"><span class="week-row-label">هفتهٔ اول</span><div class="day-circles" id="week-one-days" data-week-index="0"></div></div>
        <div class="week-day-row"><span class="week-row-label">هفتهٔ دوم</span><div class="day-circles" id="week-two-days" data-week-index="1"></div></div>
      </div>
      <div class="field-row">
        <label class="field-label">شروع<input name="start" id="course-start" type="time"></label>
        <label class="field-label">پایان<input name="end" id="course-end" type="time"></label>
      </div>
      <div class="field-row">
        <label class="field-label">شمارهٔ اتاق<input name="room" id="course-room" type="text" inputmode="numeric" maxlength="50" placeholder="اختیاری"></label>
        <label class="field-label">نام استاد<input name="teacher" id="course-teacher" maxlength="80" placeholder="اختیاری"></label>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="secondary-button cancel-dialog">لغو</button><button type="submit" class="primary-button">ذخیره</button></div>
      <button type="button" class="delete-course-button" id="delete-course-button" hidden>حذف درس</button>
    </form>
  </dialog>
  <dialog id="course-details-dialog" class="course-details-dialog">
    <div class="dialog-heading"><h2 id="details-title">جزئیات درس</h2><button type="button" class="icon-button close-details" aria-label="بستن">×</button></div>
    <dl class="details-list">
      <div><dt>ساعت</dt><dd id="details-time"></dd></div>
      <div><dt>روزهای برگزاری</dt><dd id="details-days"></dd></div>
      <div><dt>شمارهٔ اتاق</dt><dd id="details-room"></dd></div>
      <div><dt>استاد</dt><dd id="details-teacher"></dd></div>
    </dl>
    <div class="details-actions">
      <button type="button" class="secondary-button" id="course-notes-button">یادداشت‌ها</button>
      <button type="button" class="primary-button" id="edit-course-from-details">ویرایش درس</button>
    </div>
  </dialog>
  <dialog id="note-dialog" class="course-dialog note-dialog">
    <form id="note-form" novalidate>
      <div class="dialog-heading"><h2 id="note-dialog-title">یادداشت</h2><button type="button" class="icon-button close-note" aria-label="بستن">×</button></div>
      <input id="note-id" type="hidden">
      <label class="field-label">عنوان<input id="note-title" maxlength="100" required></label>
      <label class="field-label">متن<textarea id="note-text" rows="7" maxlength="5000"></textarea></label>
      <p id="note-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="secondary-button cancel-note">لغو</button><button type="submit" class="primary-button">ذخیره</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
